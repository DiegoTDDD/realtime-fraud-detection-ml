[project]
name = "realtime-fraud-detection-ml"
version = "1.1.0"
description = "XGBoost fraud classifier scoring a live Kafka stream with Spark Structured Streaming"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Diego Alves" }]
# Pinned runtime dependencies live in requirements.txt (full pipeline),
# dashboard/requirements.txt (deployed dashboard) and requirements-test.txt (unit tests).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not spark'"
markers = ["spark: needs Java and Spark; run with -m spark"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".github"]

[tool.ruff.lint]
# ANN: type hints on every function in training/ and scoring/.
# T20: no print() there either; progress goes through logging.
select = ["E", "F", "I", "B", "UP", "ANN", "T20"]
ignore = ["E402", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "T20"]
"scripts/**" = ["ANN", "T20"]
"scripts/build_case_study.py" = ["ANN", "T20", "E501"]  # long prose strings
"dashboard/**" = ["ANN", "T20", "E501"]
