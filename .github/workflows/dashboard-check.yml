name: Dashboard check

# Starts the dashboard and opens it in a real browser (dark and light mode) to make sure
# every chart legend is readable (text contrast of at least 4.5:1).
on:
  push:
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-check.yml"
      - ".github/scripts/check_legends.py"
  workflow_dispatch:

jobs:
  legends:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the dashboard and a browser
        run: |
          python -m pip install --upgrade pip
          pip install -r dashboard/requirements.txt playwright
          playwright install --with-deps chromium

      - name: Start the dashboard
        run: |
          nohup streamlit run dashboard/app.py --server.headless true --server.port 8501 > streamlit.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8501/_stcore/health >/dev/null; then echo "dashboard is up"; exit 0; fi
            sleep 2
          done
          echo "::error::the dashboard did not start"
          tail -30 streamlit.log
          exit 1

      - name: Measure the legend contrast
        run: python .github/scripts/check_legends.py

      - name: Show the dashboard log on failure
        if: failure()
        run: tail -40 streamlit.log
