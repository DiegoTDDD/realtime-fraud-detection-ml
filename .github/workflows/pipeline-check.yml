name: Pipeline check

# Trains the model, then runs the real scoring pipeline: Redpanda (Docker, from the
# sibling realtime-fraud-streaming repo) -> producer -> Spark -> XGBoost -> Parquet,
# and opens the dashboard.
on:
  push:
    paths:
      - requirements.txt
      - "scoring/**"
      - "training/**"
      - "dashboard/**"
      - ".github/workflows/pipeline-check.yml"
  workflow_dispatch:

jobs:
  scoring:
    name: Train + score
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: ml

      - uses: actions/checkout@v4
        with:
          repository: DiegoTDDD/realtime-fraud-streaming
          path: streaming

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt confluent-kafka==2.5.3 faker==30.3.0
          pip check

      - name: Generate data and train the model
        working-directory: ml
        run: |
          python training/generate_training_data.py
          python training/train_model.py
          ls -la training/model.joblib

      - name: Start Redpanda
        working-directory: streaming
        run: docker compose up -d --wait redpanda

      - name: Start the producer (it creates the topic on its first message)
        working-directory: streaming
        run: |
          nohup python producer/producer.py > ../producer.log 2>&1 &
          sleep 15
          tail -3 ../producer.log

      - name: Start the scoring job
        working-directory: ml
        run: nohup python scoring/score_stream.py > ../scoring.log 2>&1 &

      - name: Wait until real predictions have been written
        working-directory: ml
        run: |
          python - <<'PY'
          import glob, subprocess, sys, time
          import pandas as pd

          def rows(path):
              n = 0
              for f in glob.glob(path + "/*.parquet"):
                  try:
                      n += len(pd.read_parquet(f))
                  except Exception:
                      pass
              return n

          def alive(pattern):
              return subprocess.run(["pgrep", "-f", pattern], capture_output=True).returncode == 0

          def wait(path, minimum, seconds, label, process):
              start = time.time()
              while time.time() - start < seconds:
                  n = rows(path)
                  if n >= minimum:
                      print(f"{label}: {n} rows after {int(time.time() - start)}s")
                      return
                  if not alive(process):
                      print(f"::error::the Spark job stopped before {label} had data (rows so far: {n})")
                      sys.exit(1)
                  time.sleep(5)
              print(f"::error::{label}: only {rows(path)} rows after {seconds}s (needed {minimum})")
              sys.exit(1)

          wait("data/predictions", 100, 420, "predictions", "score_stream.py")
          PY

      - name: Check the predictions
        working-directory: ml
        run: |
          python - <<'PY'
          import sys
          import pandas as pd
          p = pd.read_parquet("data/predictions")
          print("prediction rows:", len(p), "| columns:", list(p.columns))
          need = {"fraud_probability", "predicted_fraud", "is_fraud"}
          if not need <= set(p.columns):
              print(f"::error::unexpected columns: {list(p.columns)}")
              sys.exit(1)
          if len(p) < 100 or not p["fraud_probability"].between(0, 1).all():
              print(f"::error::bad predictions: rows={len(p)}, min={p['fraud_probability'].min()}, max={p['fraud_probability'].max()}")
              sys.exit(1)
          print("predictions ok")
          PY

      - name: Dashboard opens without errors
        working-directory: ml
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("dashboard/app.py", default_timeout=120).run()
          assert not at.exception, [e.value for e in at.exception]
          print("dashboard ok")
          PY

      - name: Show logs on failure
        if: failure()
        run: |
          echo "--- producer"; tail -20 producer.log || true
          echo "--- scoring"; tail -60 scoring.log || true
          docker compose -f streaming/docker-compose.yml logs --tail 40 redpanda || true

      - name: Tear down
        if: always()
        run: |
          pkill -f producer.py || true
          pkill -f score_stream.py || true
          docker compose -f streaming/docker-compose.yml down -v
