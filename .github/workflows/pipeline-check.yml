name: Pipeline check

# Trains the model, then runs the real scoring pipeline: Redpanda and its schema registry
# (Docker, from the sibling realtime-fraud-streaming repo) -> producer -> Spark with per-card
# state -> XGBoost -> Delta. Kills the scoring job mid-stream and restarts it, then requires
# exactly one prediction per Kafka message and a passing model monitor.
on:
  push:
    paths:
      - requirements.txt
      - "scoring/**"
      - "training/**"
      - "dashboard/**"
      - "tests/**"
      - ".github/workflows/pipeline-check.yml"
  workflow_dispatch:

jobs:
  scoring:
    name: Train + score
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: ml

      - uses: actions/checkout@v4
        with:
          repository: DiegoTDDD/realtime-fraud-streaming
          path: streaming

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt "confluent-kafka[json,schemaregistry]==2.5.3" faker==30.3.0 pytest==9.2.0
          pip check

      - name: Spark tests (state across a restart, idempotent writes, wire format)
        working-directory: ml
        run: pytest -m spark -q

      - name: Generate data and train the model
        working-directory: ml
        run: |
          python training/generate_training_data.py
          python training/train_model.py
          ls -la training/model.joblib training/reference_distribution.json

      - name: Start Redpanda and register the event schema
        working-directory: streaming
        run: |
          docker compose up -d --wait redpanda
          python contract/registry.py register

      - name: Start the producer
        working-directory: streaming
        run: |
          nohup python producer/producer.py > ../producer.log 2>&1 &
          sleep 10
          tail -3 ../producer.log

      - name: Start the scoring job
        working-directory: ml
        run: nohup python scoring/score_stream.py > ../scoring.log 2>&1 &

      - name: Wait for predictions, then kill the scoring job mid-stream
        working-directory: ml
        run: |
          python scripts/wait_for_predictions.py --min-rows 300 --timeout 480
          pkill -9 -f score_stream.py
          echo "killed with SIGKILL"; sleep 20

      - name: Restart the scoring job from its checkpoint
        working-directory: ml
        run: |
          nohup python scoring/score_stream.py > ../scoring2.log 2>&1 &
          # Past the 5-minute warm-up the monitor skips, with enough rows to judge.
          python scripts/wait_for_predictions.py --min-rows 4500 --timeout 600

      - name: Stop the producer and let the scoring job catch up with the topic
        working-directory: ml
        run: |
          pkill -f producer.py || true
          python scripts/wait_for_predictions.py --match-topic --timeout 180
          pkill -f score_stream.py || true
          sleep 5

      - name: One prediction per message, and velocity carried across the restart
        working-directory: ml
        run: |
          python - <<'PY'
          import os, sys
          from confluent_kafka import Consumer, TopicPartition
          from deltalake import DeltaTable

          p = DeltaTable("data/predictions").to_pandas()
          c = Consumer({"bootstrap.servers": "localhost:19092", "group.id": "check"})
          parts = c.list_topics("transactions").topics["transactions"].partitions
          messages = sum(c.get_watermark_offsets(TopicPartition("transactions", n))[1] for n in parts)
          keys = p[["kafka_partition", "kafka_offset"]].drop_duplicates()
          print(f"messages {messages} | predictions {len(p)} | distinct offsets {len(keys)}")
          if len(p) != messages or len(keys) != len(p) or not p["transaction_id"].is_unique:
              print("::error::predictions do not match the topic one to one"); sys.exit(1)
          if not p["fraud_probability"].between(0, 1).all():
              print("::error::probability out of range"); sys.exit(1)
          bursts = p[p["fraud_type"] == "card_testing"]
          print("card_testing rows:", len(bursts), "max tx_count_last_5min:", bursts["tx_count_last_5min"].max())
          sys.stdout.flush()
          os._exit(0)  # deltalake's runtime threads can abort a normal interpreter exit
          PY

      - name: Model monitor passes on the live predictions
        working-directory: ml
        run: python scoring/monitor.py

      - name: Dashboard opens without errors
        working-directory: ml
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("dashboard/app.py", default_timeout=120).run()
          assert not at.exception, [e.value for e in at.exception]
          print("dashboard ok", flush=True)
          import os; os._exit(0)  # deltalake's runtime threads can abort a normal interpreter exit
          PY

      - name: Show logs on failure
        if: failure()
        run: |
          echo "--- producer"; tail -20 producer.log || true
          echo "--- scoring"; tail -60 scoring.log || true
          echo "--- scoring after restart"; tail -60 scoring2.log || true
          docker compose -f streaming/docker-compose.yml logs --tail 40 redpanda || true

      - name: Tear down
        if: always()
        run: |
          pkill -f producer.py || true
          pkill -f score_stream.py || true
          docker compose -f streaming/docker-compose.yml down -v
